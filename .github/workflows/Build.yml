name: Auto Patch & Build Shadow Kernel v5.0.0 (gta4lve)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-shadow-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: 2. Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl \
            zlib1g-dev libxml2-utils bzip2 libbz2-dev squashfs-tools pngcrush schedtool \
            dpkg-dev liblz4-tool make optipng bc libssl-dev device-tree-compiler \
            libncurses5-dev python2 python3 python-is-python3 cpio wget pkg-config libyaml-dev \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu

      - name: 3. Download Exact Toolchains (clang-r383902 + GCC 4.9)
        run: |
          mkdir -p $(pwd)/toolchain/clang/host/linux-x86/clang-r383902
          mkdir -p $(pwd)/toolchain/gcc/linux-x86/aarch64

          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C $(pwd)/toolchain/clang/host/linux-x86/clang-r383902
          rm clang.tar.gz

          git clone --depth=1 --branch android11-release --single-branch https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 $(pwd)/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

      - name: 4. Auto-Integrate KernelSU & Sync with Shadow SU v5.0.0
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

          if [ -f "KernelSU/kernel/apk_sign.c" ]; then
            sed -i 's/EXPECTED_HASH.*/EXPECTED_HASH = "6c61873641866397c9913572f6f978b60644ff5ed5b0beb77a6f62d6e8734b7d";/g' KernelSU/kernel/apk_sign.c || true
            sed -i '/bool is_manager_apk/,/^}/ s/return .*/return true;/' KernelSU/kernel/apk_sign.c || true
            sed -i '/bool ksu_is_manager_apk/,/^}/ s/return .*/return true;/' KernelSU/kernel/apk_sign.c || true
          fi

          if [ -f "KernelSU/kernel/Makefile" ]; then
            sed -i 's/-DKSU_VERSION=[^ ]*/-DKSU_VERSION=50000/g' KernelSU/kernel/Makefile || true
          fi
          if [ -f "KernelSU/kernel/ksu.h" ]; then
            sed -i 's/#define KERNEL_SU_VERSION .*/#define KERNEL_SU_VERSION 50000/g' KernelSU/kernel/ksu.h || true
          fi

      - name: 5. Patch Defconfig & Fix DTC YAML / Kconfig Issues
        run: |
          # 1. تنظيف محارف Windows المخفية في ملفات Kconfig
          sed -i 's/\r$//' drivers/input/hx9031_sar/Kconfig || true

          # 2. حل خطأ yamltree.c / libyaml النهائي في scripts/dtc/Makefile
          if [ -f "scripts/dtc/Makefile" ]; then
            # هذا الإصدار يربط أدوات المضيف باستخدام HOSTLOADLIBES_<target>.
            sed -i 's/^HOSTLDLIBS_dtc[[:space:]]*:=/HOSTLOADLIBES_dtc :=/' scripts/dtc/Makefile
            grep -q '^HOSTLOADLIBES_dtc[[:space:]]*:= -lyaml$' scripts/dtc/Makefile
          fi

          # 3. تلقيح الديف كونفيج الأساسي
          CFG="arch/arm64/configs/gta4lve_eur_open_defconfig"
          echo "CONFIG_KSU=y" >> "$CFG"
          echo "CONFIG_KPROBES=y" >> "$CFG"
          echo "CONFIG_HAVE_KPROBES=y" >> "$CFG"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$CFG"
          echo "CONFIG_OVERLAY_FS=y" >> "$CFG"

      - name: 6. Compile Kernel (Using Official build_kernel.sh Flags)
        run: |
          chmod +x tools/mkdtimg/* || true
          chmod +x scripts/* || true

          export GCC_PATH=$(pwd)/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin
          export CLANG_TOOL_PATH=$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin
          export PATH=${CLANG_TOOL_PATH}:${GCC_PATH}:${PATH}

          # Linux 4.14 appends '+' when LOCALVERSION is unset; keep the release exact.
          export LOCALVERSION=

          export CROSS_COMPILE=${GCC_PATH}/aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export ARCH=arm64

          export BSP_BUILD_FAMILY=qogirl6
          export DTC_OVERLAY_TEST_EXT=$(pwd)/tools/mkdtimg/ufdt_apply_overlay
          export DTC_OVERLAY_VTS_EXT=$(pwd)/tools/mkdtimg/ufdt_verify_overlay_host
          export BSP_BUILD_ANDROID_OS=y

          mkdir -p $(pwd)/out

          # الخطوة الأولى: تجهيز الـ defconfig
          make -C $(pwd) O=$(pwd)/out BSP_BUILD_DT_OVERLAY=y CC=clang LD=ld.lld ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE} CLANG_TRIPLE=aarch64-linux-gnu- HOSTCFLAGS="-Wno-deprecated-declarations" gta4lve_eur_open_defconfig

          # تأكيد تفعيل KSU و KPROBES داخل out/.config
          ./scripts/config --file $(pwd)/out/.config -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS -e OVERLAY_FS
          # يجعل uname -r ونسخة النواة المعروضة تتضمن لاحقة Shadow.
          ./scripts/config --file $(pwd)/out/.config --set-str LOCALVERSION "-Shadow"
          ./scripts/config --file $(pwd)/out/.config -d LOCALVERSION_AUTO
          make -C $(pwd) O=$(pwd)/out BSP_BUILD_DT_OVERLAY=y CC=clang LD=ld.lld ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE} CLANG_TRIPLE=aarch64-linux-gnu- HOSTCFLAGS="-Wno-deprecated-declarations" olddefconfig

          KERNEL_RELEASE=$(make -s -C $(pwd) O=$(pwd)/out ARCH=arm64 kernelrelease)
          echo "Kernel release: ${KERNEL_RELEASE}"
          if [ "${KERNEL_RELEASE}" != "4.14.199-Shadow" ]; then
            echo "::error::Expected kernel release 4.14.199-Shadow, got ${KERNEL_RELEASE}"
            exit 1
          fi

          # الخطوة الثانية: بناء الكيرنال بالكامل
          make -C $(pwd) O=$(pwd)/out BSP_BUILD_DT_OVERLAY=y CC=clang LD=ld.lld ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE} CLANG_TRIPLE=aarch64-linux-gnu- HOSTCFLAGS="-Wno-deprecated-declarations" -j$(nproc --all)

          cp out/arch/arm64/boot/Image $(pwd)/arch/arm64/boot/Image || true

      - name: 7. Upload Compiled Shadow Kernel v5.0.0
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-4.14.199-Shadow-gta4lve
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dtbo.img

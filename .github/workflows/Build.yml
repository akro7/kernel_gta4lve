name: Build SM-T509 Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Runner and Clone Repositories
    runs-on: ubuntu-22.04

    steps:
      - name: Cleanup Runner
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "       RUNNER CLEANUP"
          echo "======================================"

          echo "Disk usage before cleanup:"
          df -h /

          sudo apt-get update

          mapfile -t PURGE_PKGS < <(
            dpkg-query -W -f='${binary:Package}\n' 2>/dev/null |
            grep -E '^(azure-cli|google-cloud-cli|microsoft-edge-stable|google-chrome-stable|firefox|postgresql.*|temurin-.*|mysql.*|dotnet-sdk-.*)$' || true
          )

          if ((${#PURGE_PKGS[@]})); then
            sudo apt-get purge -y "${PURGE_PKGS[@]}"
          fi

          sudo rm -rf \
            /usr/share/swift \
            /usr/share/miniconda \
            /usr/share/az* \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/local/julia \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /usr/share/gradle \
            /usr/local/lib/android \
            /usr/lib/android-sdk \
            /usr/share/dotnet \
            /usr/lib/dotnet \
            /opt/ghc \
            /usr/local/haskell \
            /opt/hostedtoolcache

          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "Disk usage after cleanup:"
          df -h /

          echo "Cleanup completed."

      - name: Install Required Packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            flex libncurses-dev libncurses5-dev libncursesw5-dev fakeroot rsync kmod xz-utils \
            lz4 openssl python3 device-tree-compiler pahole dialog bash sed wget git curl zip tar jq expect make \
            cmake automake autoconf binutils apt-utils perl gperf gawk bc zstd unzip cpio bison build-essential \
            ccache liblz4-tool libsdl1.2-dev libstdc++6 libxml2 libxml2-utils lzop pngcrush schedtool squashfs-tools \
            xsltproc zlib1g-dev bzip2 libssl-dev dwarves libelf-dev libyaml-dev dos2unix python-is-python3 git gh git-lfs nano

          sudo apt-get autoremove -y

      - name: Clone Kernel Repository
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/akro7/kernel_gta4lve.git
          cd kernel_gta4lve
          echo "Kernel repository cloned successfully."

      - name: Fix host dtc libyaml linker flag
        working-directory: kernel_gta4lve
        shell: bash
        run: |
          set -euo pipefail
          DTC_MAKEFILE="scripts/dtc/Makefile"
          test -f "$DTC_MAKEFILE"
          sed -i -E 's/^HOSTLDLIBS_dtc[[:space:]]*:=/HOSTLOADLIBES_dtc :=/' "$DTC_MAKEFILE"
          grep -Fxq 'HOSTLOADLIBES_dtc := -lyaml' "$DTC_MAKEFILE"

      - name: Clone Toolchain Repository
        working-directory: kernel_gta4lve
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Mkolpo90/toolchain.git
          echo "Toolchain repository cloned successfully."

      - name: Apply BakaSU v4.2.0-rc3 hooks and ShadowSU manager config
        working-directory: kernel_gta4lve
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/v4.2.0-rc3/kernel/setup.sh" | bash -s -- v4.2.0-rc3
          test -L drivers/kernelsu
          test "$(git -C KernelSU describe --exact-match --tags)" = "v4.2.0-rc3"

          python3 .github/scripts/apply_bakasu_4_14.py

          DEFCONFIG="arch/arm64/configs/gta4lve_eur_open_defconfig"
          for symbol in CONFIG_KSU CONFIG_KSU_MANUAL_HOOK CONFIG_KSU_MULTI_MANAGER_SUPPORT CONFIG_KSU_TOOLKIT_SUPPORT CONFIG_DEVTMPFS CONFIG_PID_NS CONFIG_USER_NS CONFIG_KALLSYMS_ALL CONFIG_ZRAM CONFIG_CRYPTO_LZ4 CONFIG_LZ4_COMPRESS CONFIG_IP6_NF_NAT; do
            grep -qxF "${symbol}=y" "$DEFCONFIG" || { echo "::error::Missing ${symbol}=y"; exit 1; }
          done
          for symbol in CONFIG_KSU_TRACEPOINT_HOOK CONFIG_KSU_SUSFS; do
            grep -qxF "# ${symbol} is not set" "$DEFCONFIG" || { echo "::error::Expected ${symbol} disabled"; exit 1; }
          done

      - name: Build Shadow-4.14.199 kernel
        working-directory: kernel_gta4lve
        shell: bash
        run: |
          set -euo pipefail
          export LOCALVERSION=

          python3 - <<'PY'
          from pathlib import Path
          build = Path("build_kernel.sh")
          text = build.read_text()
          make_prefix = "make -C $(pwd) O=$(pwd)/out "
          if text.count(make_prefix) != 2:
              raise SystemExit("Unexpected build_kernel.sh make command layout")
          make_args = (
              "KERNELVERSION=Shadow-4.14.199 "
              "KSU_EXPECTED_SIZE=0x0354 "
              "KSU_EXPECTED_HASH=2468c90116adfac52c254cc235c8e10e27e6873e4c87c5eef1423737701b426c "
              "KSU_MANAGER_PACKAGE=me.weishu.kernelsu "
          )
          updated = text.replace(make_prefix, make_prefix + make_args)
          for argument in ("KERNELVERSION=Shadow-4.14.199", "KSU_EXPECTED_SIZE=0x0354", "KSU_EXPECTED_HASH=2468c90116adfac52c254cc235c8e10e27e6873e4c87c5eef1423737701b426c", "KSU_MANAGER_PACKAGE=me.weishu.kernelsu"):
              if updated.count(argument) != 2:
                  raise SystemExit(f"Expected two make arguments for {argument}")
          build.write_text(updated)
          PY

          bash -euo pipefail build_kernel.sh
          test -s out/arch/arm64/boot/Image
          KERNEL_RELEASE="$(make -s -C "$PWD" O="$PWD/out" ARCH=arm64 KERNELVERSION=Shadow-4.14.199 kernelrelease)"
          echo "Manager-visible kernel release: ${KERNEL_RELEASE}"
          if [[ "$KERNEL_RELEASE" != "Shadow-4.14.199" ]]; then
            echo "::error::Expected Shadow-4.14.199, got ${KERNEL_RELEASE}"
            exit 1
          fi
          ls -lh out/arch/arm64/boot/Image

      - name: Upload Shadow-4.14.199 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-4.14.199
          path: |
            kernel_gta4lve/out/arch/arm64/boot/Image*
            kernel_gta4lve/out/arch/arm64/boot/dts/**/*.dtb
            kernel_gta4lve/out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn

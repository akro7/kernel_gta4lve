name: Build SM-T509 Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Runner and Clone Repositories
    runs-on: ubuntu-22.04

    steps:
      - name: Cleanup Runner
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "       RUNNER CLEANUP"
          echo "======================================"

          echo "Disk usage before cleanup:"
          df -h /

          sudo apt-get update

          mapfile -t PURGE_PKGS < <(
            dpkg-query -W -f='${binary:Package}\\n' 2>/dev/null |
            grep -E '^(azure-cli|google-cloud-cli|microsoft-edge-stable|google-chrome-stable|firefox|postgresql.*|temurin-.*|mysql.*|dotnet-sdk-.*)$' || true
          )

          if ((${#PURGE_PKGS[@]})); then
            sudo apt-get purge -y "${PURGE_PKGS[@]}"
          fi

          sudo rm -rf \\
            /usr/share/swift \\
            /usr/share/miniconda \\
            /usr/share/az* \\
            /usr/local/lib/node_modules \\
            /usr/local/share/chromium \\
            /usr/local/share/powershell \\
            /usr/local/julia \\
            /usr/local/aws-cli \\
            /usr/local/aws-sam-cli \\
            /usr/share/gradle \\
            /usr/local/lib/android \\
            /usr/lib/android-sdk \\
            /usr/share/dotnet \\
            /usr/lib/dotnet \\
            /opt/ghc \\
            /usr/local/haskell \\
            /opt/hostedtoolcache

          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "Disk usage after cleanup:"
          df -h /

          echo "Cleanup completed."

      - name: Install Required Packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \\
            flex libncurses-dev libncurses5-dev libncursesw5-dev fakeroot rsync kmod xz-utils \\
            lz4 openssl python3 device-tree-compiler pahole dialog bash sed wget git curl zip tar jq expect make \\
            cmake automake autoconf binutils apt-utils perl gperf gawk bc zstd unzip cpio bison build-essential \\
            ccache liblz4-tool libsdl1.2-dev libstdc++6 libxml2 libxml2-utils lzop pngcrush schedtool squashfs-tools \\
            xsltproc zlib1g-dev bzip2 libssl-dev dwarves libelf-dev dos2unix python-is-python3 git gh git-lfs nano

          sudo apt-get autoremove -y

      - name: Clone Kernel Repository
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/akro7/kernel_gta4lve.git
          cd kernel_gta4lve
          echo "Kernel repository cloned successfully."

      - name: Clone Toolchain Repository
        working-directory: kernel_gta4lve
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Mkolpo90/toolchain.git
          echo "Toolchain repository cloned successfully."

      - KernelSU
        shell: bash
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash
          echo CONFIG_KSU=y >> arch/arm64/configs/gta4lve_eur_open_defconfig
          echo CONFIG_KSU_TAMPER_SYSCALL_TABLE=y >> arch/arm64/configs/gta4lve_eur_open_defconfig
          
      - Building
        shell: bash
        run: |
        set -euo pipefail
        bash build_kernel.sh
